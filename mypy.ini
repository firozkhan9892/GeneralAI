[mypy-faiss]
ignore_missing_imports = True

[mypy-sentence_transformers]
ignore_missing_imports = True

[mypy-bs4]
ignore_missing_imports = True

[mypy-chromadb]
ignore_missing_imports = True

[mypy-pypdf]
ignore_missing_imports = True
