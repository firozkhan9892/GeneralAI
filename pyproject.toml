[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generalai"
dynamic = ["version"]
description = "Autonomous AI Platform - production-grade foundation with multi-LLM routing, workflow automation, plugin system, and enterprise RAG."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Firoz Khan", email = "firozkhan2027k@gmail.com" },
]
keywords = [
    "ai",
    "agent",
    "llm",
    "rag",
    "automation",
    "workflow",
    "plugins",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.104,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "uvicorn[standard]>=0.24,<1.0",
    "numpy>=1.24,<3.0",
]

[project.optional-dependencies]
pdf = [
    "pypdf>=3.15",
]
html = [
    "beautifulsoup4>=4.12",
]
embeddings = [
    "sentence-transformers>=2.2",
]
chroma = [
    "chromadb>=0.4",
]
faiss = [
    "faiss-cpu>=1.7",
]
all = [
    "pypdf>=3.15",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
    "faiss-cpu>=1.7",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.1,<6.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.1,<1.0",
    "mypy>=1.7,<2.0",
    "black>=24.0,<25.0",
]

[project.urls]
Homepage = "https://github.com/firozkhan9892/GeneralAI"
Repository = "https://github.com/firozkhan9892/GeneralAI"
Documentation = "https://github.com/firozkhan9892/GeneralAI/tree/main/docs"

[project.scripts]
generalai = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "docs*", "data*", "models*", "logs*"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }
